<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity History</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <aside class="sidebar">
    <h2>💚 FitTrack</h2>
    <nav>
      <a href="index.html">🏠 Dashboard</a>
      <a href="profile.html">👤 My Profile</a>
      <a href="achievements.html">🏆 Achievements</a>
      <a href="water.html">💧 Water Tracker</a>
      <a href="history.html" class="active">📋 Activity History</a>
      <a href="report.html">📊 Monthly Report</a>
    </nav>
  </aside>

  <main class="container">
    <h1>📋 Activity History</h1>
    <section class="card">
      <p>Your saved fitness records.</p>
      <div style="overflow-x:auto;">
        <table>
          <thead>
  <tr>
    <th>Date</th>
    <th>Exercise Type</th>
    <th>Exercise Name</th>
    <th>Steps</th>
    <th>Distance (km)</th>
    <th>Duration (min)</th>
  </tr>
</thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  
<script>
  const records = JSON.parse(localStorage.getItem("fitnessRecords")) || [];
  const body = document.getElementById("historyBody");

  if (records.length === 0) {
    body.innerHTML = '<tr><td colspan="6">No activity records yet.</td></tr>';
  } else {
    records.forEach(record => {
      body.innerHTML += `
        <tr>
          <td>${record.date || "-"}</td>
          <td>${record.exerciseType || "-"}</td>
          <td>${record.exerciseName || "-"}</td>
          <td>${record.steps || 0}</td>
          <td>${record.distance || 0} km</td>
          <td>${record.duration || 0} mins</td>
        </tr>`;
    });
  }
</script>

<script src="notifications.js"></script>
</body>
</html>
