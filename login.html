
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitTrack Login</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #123c32, #32856a);
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 38px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,.2);
    }
    .login-logo { text-align: center; font-size: 38px; }
    .login-card h1 { text-align: center; color: #176449; }
    .subtitle { text-align: center; color: #87938e; margin: 10px 0 25px; }
    .login-card button { width: 100%; }
    .message { text-align: center; margin-top: 15px; color: #176449; }
    .footer { text-align: center; margin-top: 20px; color: #71817b; }
    a { color: #176449; font-weight: bold; text-decoration: none; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">🏃</div>
    <h1>FitTrack</h1>
    <p class="subtitle">Welcome back! Sign in to continue.</p>

    <form id="loginForm">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="Enter your email" required>

      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password" required>

      <button type="submit">Sign In</button>
    </form>

    <p class="message" id="message"></p>
    <p class="footer">New user? <a href="signup.html" id="signupLink">Create an account</a></p>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      const savedAccount = JSON.parse(localStorage.getItem("fitTrackDemoAccount"));

      if (!savedAccount) {
        message.textContent = "Please sign up first.";
        return;
      }

      if (email === savedAccount.email && password === savedAccount.password) {
        localStorage.setItem("fitTrackLoggedIn", "true");
        message.textContent = "Login successful!";

        setTimeout(() => {
          window.location.href = "index.html";
        }, 1000);
      } else {
        message.textContent = "Incorrect email or password.";
      }
    });
  </script>
</body>
</html>
