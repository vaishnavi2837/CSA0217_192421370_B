
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | FitTrack</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .profile-container {
      max-width: 650px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      border-radius: 16px;
      color: #222;
    }
    .profile-container h1 {
      text-align: center;
      color: #16865f;
    }
    .profile-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #d9f5e8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 45px;
      margin: 20px auto;
    }
    .profile-container label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    .profile-container input {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }
    .profile-container button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      background: #16865f;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #profileMessage {
      text-align: center;
      color: #16865f;
      font-weight: bold;
    }
  </style>
</head>

<body>

<aside class="sidebar">
  <h2>💚 FitTrack</h2>
  <nav>
    <a href="index.html">🏠 Dashboard</a>
    <a href="profile.html" class="active">👤 My Profile</a>
    <a href="achievements.html">🏆 Achievements</a>
    <a href="water.html">💧 Water Tracker</a>
    <a href="history.html">📋 Activity History</a>
    <a href="report.html">📊 Monthly Report</a>
    <a href="assistant.html">🤖 AI Fitness Assistant</a>
  </nav>
</aside>

<div class="profile-container">
  <h1>My Profile</h1>
  <div class="profile-avatar">👤</div>

  <form id="profileForm">
    <label>Full Name</label>
    <input type="text" id="profileName" placeholder="Enter your name" required>

    <label>Email</label>
    <input type="email" id="profileEmail" placeholder="Enter your email">

    <label>Age</label>
    <input type="number" id="profileAge" placeholder="Enter your age" min="1">

    <label>Height (cm)</label>
    <input type="number" id="profileHeight" placeholder="Enter height" min="1">

    <label>Weight (kg)</label>
    <input type="number" id="profileWeight" placeholder="Enter weight" min="1">

    <button type="submit">Save Profile</button>
  </form>

  <p id="profileMessage"></p>

  <div style="margin-top:20px; padding:15px; background:#e8f8ef; border-radius:10px;">
    <h3>Saved Profile Details</h3>
    <p><b>Name:</b> <span id="savedName"></span></p>
    <p><b>Email:</b> <span id="savedEmail"></span></p>
    <p><b>Age:</b> <span id="savedAge"></span></p>
    <p><b>Height:</b> <span id="savedHeight"></span> cm</p>
    <p><b>Weight:</b> <span id="savedWeight"></span> kg</p>
  </div>
</div>

<script>
const fields = [
  "profileName",
  "profileEmail",
  "profileAge",
  "profileHeight",
  "profileWeight"
];

function showSavedProfile() {
  document.getElementById("savedName").textContent =
    localStorage.getItem("profileName") || "Not added";

  document.getElementById("savedEmail").textContent =
    localStorage.getItem("profileEmail") || "Not added";

  document.getElementById("savedAge").textContent =
    localStorage.getItem("profileAge") || "Not added";

  document.getElementById("savedHeight").textContent =
    localStorage.getItem("profileHeight") || "Not added";

  document.getElementById("savedWeight").textContent =
    localStorage.getItem("profileWeight") || "Not added";
}

// Load previously saved details
fields.forEach(id => {
  document.getElementById(id).value =
    localStorage.getItem(id) || "";
});

showSavedProfile();

// Save profile
document.getElementById("profileForm").addEventListener("submit", function(e) {
  e.preventDefault();

  fields.forEach(id => {
    localStorage.setItem(
      id,
      document.getElementById(id).value.trim()
    );
  });

  showSavedProfile();

  document.getElementById("profileMessage").textContent =
    "✅ Profile saved successfully!";
    addFitTrackNotification(
  "👤 Profile Saved",
  "Your profile details were saved successfully!"
);
});
</script>
<script src="notifications.js"></script>

</body>
</html>
