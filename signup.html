
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitTrack | Sign Up</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #123c32, #32856a);
      padding: 20px;
    }
    .signup-card {
      width: 100%;
      max-width: 440px;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,.2);
    }
    .signup-logo {
      text-align: center;
      font-size: 38px;
    }
    h1 {
      text-align: center;
      color: #176449;
      margin: 10px 0 8px;
    }
    .subtitle {
      text-align: center;
      color: #87938e;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .signup-card button {
      width: 100%;
    }
    .message {
      text-align: center;
      margin-top: 15px;
      color: #176449;
      font-size: 14px;
    }
    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #71817b;
    }
    a {
      color: #176449;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="signup-card">
    <div class="signup-logo">🏃</div>
    <h1>Create Account</h1>
    <p class="subtitle">Start your fitness journey with FitTrack.</p>

    <form id="signupForm">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Enter your full name" required>

      <label>Email Address</label>
      <input type="email" id="email" placeholder="Enter your email" required>

      <label>Password</label>
      <input type="password" id="password" placeholder="Minimum 6 characters" minlength="6" required>

      <label>Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Re-enter password" required>

      <button type="submit">Create Account</button>
    </form>

    <p class="message" id="message"></p>

    <p class="footer">
      Already have an account? <a href="login.html">Sign In</a>
    </p>
  </div>

  <script>
    document.getElementById("signupForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const message = document.getElementById("message");

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
      }

      if (password.length < 6) {
        message.textContent = "Password must contain at least 6 characters.";
        return;
      }

      const account = { name, email, password };
      localStorage.setItem("fitTrackDemoAccount", JSON.stringify(account));

      message.textContent = "Demo account created! Please sign in.";

      setTimeout(() => {
        window.location.href = "login.html";
      }, 1200);
    });
  </script>
</body>
</html>
